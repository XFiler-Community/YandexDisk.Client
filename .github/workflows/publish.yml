name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: NuGet Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore src/YandexDisk.Client.sln

      - name: Build
        run: dotnet build src/YandexDisk.Client.sln --no-restore --configuration Release -p:Version=$VERSION

      - name: Test
        run: dotnet test src/YandexDisk.Client.sln --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/XFiler.YandexDisk.Client/XFiler.YandexDisk.Client.csproj --no-build --configuration Release --output ./nupkgs -p:Version=$VERSION

      - name: List packages
        run: ls -la ./nupkgs

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
