name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0 runs the net8.0 tests, 10.0 is the SDK the other XFiler repos build with.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/YandexDisk.Client.sln

      - name: Build
        run: dotnet build src/YandexDisk.Client.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/YandexDisk.Client.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
